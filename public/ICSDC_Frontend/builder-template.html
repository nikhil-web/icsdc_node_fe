<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/assets/js/theme-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading… | ICSDC</title>
  <meta name="description" content="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/cloud-components.css">
  <link rel="stylesheet" href="/assets/css/builder-page.css">
  <link rel="stylesheet" href="/assets/css/dark-mode.css">
</head>

<body>

  <!-- PAGE LOADER -->
  <div id="page-loader">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <p class="loader-text">Loading…</p>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>

  <!-- DROPDOWN -->
  <div id="dropdown-wrap">
    <div id="dropdown">
      <div data-strapi-dd="sidebar" class="hidden" id="dd-sidebar"></div>
      <div data-strapi-dd="flatLeft" class="hidden" id="dd-flat-left">
        <div data-strapi-dd="flatIcon" class="dd-flat-icon"></div>
        <div>
          <h3 data-strapi-dd="flatTitle"></h3>
          <p data-strapi-dd="flatDesc"></p>
        </div>
      </div>
      <div id="dd-content">
        <div id="dd-top-bar">
          <div data-strapi-dd="panelTitle" class="hidden" id="dd-panel-title"></div>
          <button class="dd-close" onclick="closeDropdown()">&#10005;</button>
        </div>
        <div data-strapi-dd="grid" id="dd-grid"></div>
      </div>
    </div>
  </div>

  <!-- NAVBAR -->
  <nav>
    <div class="nav-inner">
      <a href="/" class="logo">
        <img data-strapi-mainLogo data-strapi="mainLogo" src="" alt="ICSDC logo" class="logo-icon">
      </a>
      <ul data-strapi-nav class="nav-links" id="nav-links"></ul>
      <button class="btn-login desktop-login-btn">Login</button>
      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
      <ul data-strapi-nav-mobile class="mobile-nav-links" id="mobile-nav-links"></ul>
      <button class="btn-login mobile-login-btn">Login</button>
    </div>
  </nav>

  <!-- ════ BUILDER SECTIONS ROOT ════ -->
  <main id="builder-page-root"></main>

  <!-- FOOTER (injected by main.js) -->
  <footer class="site-footer" id="site-footer" role="contentinfo"></footer>

  <!-- SCROLL ANIMATION ENGINE -->
  <script>
    (function () {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      // Observe everything that opts in — runs after page-renderer populates
      setTimeout(function () {
        document.querySelectorAll('[data-animate], [data-stagger]').forEach(function (el) {
          observer.observe(el);
        });
      }, 100);
    })();
  </script>

  <!-- Strapi config -->
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/main.js" type="module"></script>
  <script src="/assets/js/builder/page-renderer.js" type="module"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/polish.js" defer></script>
  <script src="/assets/js/nav-search.js" defer></script>
</body>

</html>
